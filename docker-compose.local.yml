# =============================================================================
# doliGAS - overrides for development on the workstation
#
# The main file publishes no ports, because on the VPS the containers are
# reached by an external reverse proxy on the proxy_net network. Locally the
# ports are needed, so this file exposes them.
#
# Use it ONLY locally, naming it explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# It is deliberately not called docker-compose.override.yml: that name would be
# applied automatically on the VPS too, publishing ports that must not be open
# there.
# =============================================================================
services:
  gashub-db:
    ports:
      # 3307 on the host, to avoid clashing with an already installed MySQL
      - "127.0.0.1:3307:3306"

  gashub-api:
    ports:
      - "127.0.0.1:${API_PORT}:${API_PORT}"

  gashub-frontend:
    ports:
      - "127.0.0.1:8080:80"
