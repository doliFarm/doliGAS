services:
  # --- DATABASE SERVICE ---
  gashub-db:
    image: mysql:8.4
    # Ottimizzazione MySQL 8.4 per VPS con poca RAM (riduciamo i buffer di default)
    command: 
      - "mysqld"
      - "--mysql-native-password=ON"
      - "--innodb_buffer_pool_size=256M" 
      - "--innodb_log_buffer_size=16M"
      - "--max_connections=50"
    container_name: gashub-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 768M    # Ridotto: 1GB è troppo per un DB PoC su questa VPS
          cpus: '0.40'
        reservations:
          memory: 256M
    healthcheck:
      # FIX ROBUSTEZZA: Usiamo mysqladmin ma con un timeout più lungo per lo swap
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 40s
      timeout: 20s
      retries: 5
      start_period: 60s

  # --- BACKEND API SERVICE ---
  gashub-api:
    build:
      context: ./backend
      target: ${APP_ENV}
    container_name: gashub-api
    restart: unless-stopped
    expose:
      - "${API_PORT}"
    env_file:
      - .env
    environment:
      DB_HOST: gashub-db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: ${API_PORT}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${APP_ENV}
      APP_ENV: ${APP_ENV}
    depends_on:
      gashub-db:
        condition: service_healthy # Importante: avvia l'API solo quando il DB è pronto
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - internal_net
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 512M    # Ridotto: Node.js per questa API non richiede 1GB
          cpus: '0.30'
        reservations:
          memory: 256M
    healthcheck:
      # Sostituito localhost con 127.0.0.1 per forzare IPv4 e aggirare il problema ::1
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:${API_PORT}/health\", (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))'"]
      interval: 40s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- FRONTEND SERVICE ---
  gashub-frontend:
    build:
      context: ./frontend
      target: ${APP_ENV}
    container_name: gashub-frontend
    restart: unless-stopped
    expose:
      - "80"
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_APP_ENV=${APP_ENV}
    depends_on:
      - gashub-api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 256M    # 512M per un frontend statico/Vite è eccessivo
          cpus: '0.20'
        reservations:
          memory: 128M

# --- NETWORKS ---
networks:
  internal_net:
    driver: bridge
    internal: true

  proxy_net:
    external: true
    name: ${PROXY_NETWORK_NAME}
