services:
  # --- DATABASE SERVICE ---
  gashub-db:
    image: mysql:8.4
    # MySQL 8.4 tuning for a low-RAM VPS (smaller default buffers)
    command: 
      - "mysqld"
      - "--mysql-native-password=ON"
      - "--innodb_buffer_pool_size=256M" 
      - "--innodb_log_buffer_size=16M"
      - "--max_connections=50"
    container_name: gashub-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
      # No longer contains the schema: tables are created by the backend migrations
      - ./mysql-init:/docker-entrypoint-initdb.d
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 768M    # Reduced: 1GB is too much for a PoC DB on this VPS
          cpus: '0.40'
        reservations:
          memory: 256M
    healthcheck:
      # mysqladmin with a longer timeout, to cope with swapping
      # $$ escapes compose interpolation: the password is read INSIDE the container,
      # so it does not appear in clear text in the docker inspect output
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 40s
      timeout: 20s
      retries: 5
      start_period: 60s

  # --- BACKEND API SERVICE ---
  gashub-api:
    build:
      context: ./backend
      target: ${APP_ENV}
    container_name: gashub-api
    restart: unless-stopped
    expose:
      - "${API_PORT}"
    env_file:
      - .env
    environment:
      DB_HOST: gashub-db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Schema migrations applied at startup (set to false to apply them by hand)
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      PORT: ${API_PORT}
      JWT_SECRET: ${JWT_SECRET}
      ENABLE_DEBUG_API: ${ENABLE_DEBUG_API:-false}
      DEMO_SHOW_OTP: ${DEMO_SHOW_OTP:-false}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      NODE_ENV: ${APP_ENV}
      APP_ENV: ${APP_ENV}
    depends_on:
      gashub-db:
        condition: service_healthy # Important: start the API only when the DB is ready
    volumes:
      - ./backend:/app
      - /app/node_modules
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_net
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 512M    # Reduced: Node.js does not need 1GB for this API
          cpus: '0.30'
        reservations:
          memory: 256M
    healthcheck:
      # 127.0.0.1 instead of localhost, to force IPv4 and avoid the ::1 problem
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://127.0.0.1:${API_PORT}/health\", (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))'"]
      interval: 40s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- FRONTEND SERVICE ---
  gashub-frontend:
    build:
      context: ./frontend
      target: ${APP_ENV}
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_ENV: ${APP_ENV}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    container_name: gashub-frontend
    restart: unless-stopped
    expose:
      - "80"
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_APP_ENV=${APP_ENV}
      # Used by the dev target (Vite server); in the prod target the build arg above applies
      - VITE_DEMO_MODE=${VITE_DEMO_MODE:-false}
    depends_on:
      - gashub-api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - proxy_net
    deploy:
      resources:
        limits:
          memory: 256M    # 512M is too much for a static/Vite frontend
          cpus: '0.20'
        reservations:
          memory: 128M

# --- NETWORKS ---
networks:
  internal_net:
    driver: bridge
    internal: true

  proxy_net:
    external: true
    name: ${PROXY_NETWORK_NAME}
