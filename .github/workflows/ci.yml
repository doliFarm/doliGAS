# doliGAS - continuous integration
# On every push and pull request: backend tests on a real MySQL and frontend build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          TZ: Europe/Rome
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Same time zone as the containers in docker-compose.yml
      TZ: Europe/Rome
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      # With the root password the tests create the doligas_test database themselves
      DB_ROOT_PASSWORD: root
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install --no-audit --no-fund
      - name: Syntax check
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    # Same image as the frontend Dockerfile: package-lock.json was generated on
    # Alpine and only lists Rollup's musl binary, which is missing on Ubuntu (glibc)
    container: node:18-alpine
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - name: Translations are valid JSON
        run: for f in src/locales/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - run: npm run build
